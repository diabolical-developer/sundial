<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Sundial</title>
    <meta name="description" content="A to-do list laid out along the sun's path." />

    <!-- Install on iPhone: Safari → Share → Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sundial" />
    <!-- Let the sky run under the status bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#060B26" />

    <style id="expo-reset">
      html, body { height: 100%; background: #060B26; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea, input:focus-visible, textarea:focus-visible { outline: none; }
      *:focus-visible { outline: 2px solid #FFC21A; outline-offset: 2px; }

      /* Splash while the app loads: a sunrise drawn on a canvas. The app fades it out when it's ready. */
      .splash { position: fixed; inset: 0; z-index: 1000; background: #060B26; overflow: hidden;
        transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
      .splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .splash .brand { position: absolute; left: 0; right: 0; top: 24%; text-align: center; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; pointer-events: none; }
      .splash .name { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; text-shadow: 0 2px 24px rgba(10, 8, 40, 0.35);
        opacity: 0; animation: lift 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards; }
      .splash .tag { margin-top: 8px; font-size: 14px; font-weight: 500; letter-spacing: 0.3px; color: rgba(255, 255, 255, 0.78);
        opacity: 0; animation: lift 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards; }
      @keyframes lift { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
      @media (prefers-reduced-motion: reduce) { .splash .name, .splash .tag { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <noscript>Sundial needs JavaScript to run.</noscript>
    <div id="root"></div>
    <!-- Lifted by the app (fades out) once fonts and saved tasks are ready. -->
    <div id="splash" class="splash" role="img" aria-label="Sundial is loading">
      <canvas id="splash-sky"></canvas>
      <div class="brand"><div class="name">Sundial</div><div class="tag">Your day, laid out in daylight</div></div>
    </div>
    <script>
      // A sunrise, drawn live: stars fade as the sky warms, the sun climbs behind layered mountains
      // with a soft bloom and light rays, backlit ridges catch the light, and mist drifts in the valley.
      (function () {
        window.__splashStart = performance.now();
        var host = document.getElementById('splash');
        var canvas = document.getElementById('splash-sky');
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var W = 0, H = 0, dpr = 1, ridges = [], stars = [];

        function rng(seed) {
          return function () {
            seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        // Midpoint displacement: a natural-looking ridgeline, heights 0..1.
        function ridge(seed, n, rough) {
          var r = rng(seed), h = [], i, step = n, amp = 1, lo = 1e9, hi = -1e9;
          for (i = 0; i <= n; i++) h[i] = 0;
          h[0] = r(); h[n] = r();
          while (step > 1) {
            var half = step / 2;
            for (i = half; i < n; i += step) h[i] = (h[i - half] + h[i + half]) / 2 + (r() - 0.5) * amp;
            amp *= rough; step = half;
          }
          for (i = 0; i <= n; i++) { lo = Math.min(lo, h[i]); hi = Math.max(hi, h[i]); }
          return h.map(function (v) { return (v - lo) / (hi - lo || 1); });
        }
        function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function mixc(a, b, t, alpha) {
          var x = hex(a), y = hex(b);
          return 'rgba(' + Math.round(lerp(x[0], y[0], t)) + ',' + Math.round(lerp(x[1], y[1], t)) + ',' + Math.round(lerp(x[2], y[2], t)) + ',' + (alpha == null ? 1 : alpha) + ')';
        }
        function ease(t) { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); }

        // Night → dawn palettes for the sky (top to horizon) and the four mountain layers (far to near).
        var SKY_N = ['#02040F', '#060B26', '#0E1640', '#1B2459', '#27306E'];
        var SKY_D = ['#121A46', '#3B3A7C', '#8E5A8E', '#EE8A74', '#FFD7A0'];
        var LAND_N = ['#1A2358', '#121A46', '#0C1236', '#070B24'];
        var LAND_D = ['#9A6E98', '#6A4B82', '#3E2E5E', '#1A1434'];

        function build() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          W = host.clientWidth; H = host.clientHeight;
          canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          var horizon = H * 0.66;
          // [seed, points, roughness, peak y, saddle y]
          var specs = [
            [11, 128, 0.58, horizon - H * 0.16, horizon + H * 0.02],
            [41, 128, 0.55, horizon - H * 0.08, horizon + H * 0.07],
            [29, 64, 0.5, horizon + H * 0.0, horizon + H * 0.12],
            [5, 32, 0.42, horizon + H * 0.08, horizon + H * 0.15],
          ];
          ridges = specs.map(function (s) {
            var h = ridge(s[0], s[1], s[2]);
            return h.map(function (v, i) { return [(i / s[1]) * W, s[3] + (1 - v) * (s[4] - s[3])]; });
          });
          // Pines along the nearest ridge.
          var near = ridges[3], r = rng(77), trees = [];
          for (var x = 0; x < W; x += 3 + r() * 6) {
            var p = (x / W) * (near.length - 1), i = Math.floor(p), y = lerp(near[i][1], near[Math.min(i + 1, near.length - 1)][1], p - i);
            var th = Math.max(10, H * 0.022) * (0.7 + r() * 0.8) * (r() < 0.12 ? 1.5 : 1);
            trees.push([x, y + 2, th, th * (0.36 + r() * 0.12)]);
          }
          ridges.trees = trees;
          stars = [];
          var rs = rng(3);
          for (var k = 0; k < 170; k++) stars.push([rs() * W, rs() * horizon * 0.95, 0.3 + Math.pow(rs(), 4) * 1.6, rs() * 6.28, 0.6 + rs() * 1.8]);
        }

        function ridgePath(pts) {
          ctx.beginPath(); ctx.moveTo(0, H);
          for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineTo(W, H); ctx.closePath();
        }

        function frame(now) {
          var t = (now - window.__splashStart) / 1000;
          var k = still ? 1 : ease(t / 2.4); // how far the sunrise has got
          var horizon = H * 0.66;
          ctx.globalCompositeOperation = 'source-over';

          // Sky
          var g = ctx.createLinearGradient(0, 0, 0, horizon + H * 0.04);
          for (var i = 0; i < 5; i++) g.addColorStop([0, 0.32, 0.6, 0.85, 1][i], mixc(SKY_N[i], SKY_D[i], k));
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

          // Stars fade as the light comes up.
          var sa = Math.max(0, 1 - k * 1.25);
          if (sa > 0) {
            for (i = 0; i < stars.length; i++) {
              var s = stars[i], tw = 0.65 + 0.35 * Math.sin(t * s[4] + s[3]);
              ctx.globalAlpha = sa * tw * (0.35 + s[2] * 0.4);
              ctx.fillStyle = '#fff';
              ctx.beginPath(); ctx.arc(s[0], s[1], s[2], 0, 6.283); ctx.fill();
            }
            ctx.globalAlpha = 1;
          }

          // The sun rises from behind the far range.
          var R = Math.min(W, H) * 0.05;
          var sx = W * 0.56, sy = lerp(horizon + R * 2.5, horizon - H * 0.13, k);
          ctx.globalCompositeOperation = 'lighter';
          // Wide warm scattering in the lower sky.
          var sc = ctx.createRadialGradient(sx, horizon, 0, sx, horizon, Math.max(W, H) * 0.75);
          sc.addColorStop(0, 'rgba(255,170,110,' + 0.42 * k + ')');
          sc.addColorStop(0.35, 'rgba(255,120,110,' + 0.14 * k + ')');
          sc.addColorStop(1, 'rgba(255,120,110,0)');
          ctx.fillStyle = sc; ctx.fillRect(0, 0, W, H);
          // Rays of light fanning out from the sun, turning very slowly.
          var rays = 16, spin = t * 0.025;
          for (i = 0; i < rays; i++) {
            var a = (i / rays) * Math.PI * 2 + spin, wdt = 0.035 + ((i * 7) % 5) * 0.012, len = Math.max(W, H) * (0.6 + ((i * 3) % 4) * 0.12);
            var rg = ctx.createRadialGradient(sx, sy, R, sx, sy, len);
            rg.addColorStop(0, 'rgba(255,236,200,' + (0.022 + ((i * 5) % 3) * 0.01) * k + ')');
            rg.addColorStop(0.7, 'rgba(255,236,200,0)');
            ctx.fillStyle = rg;
            ctx.beginPath(); ctx.moveTo(sx, sy);
            ctx.lineTo(sx + Math.cos(a - wdt) * len, sy + Math.sin(a - wdt) * len);
            ctx.lineTo(sx + Math.cos(a + wdt) * len, sy + Math.sin(a + wdt) * len);
            ctx.closePath(); ctx.fill();
          }
          // Bloom, breathing gently.
          var breathe = 1 + 0.05 * Math.sin(t * 1.6);
          var bl = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 7 * breathe);
          bl.addColorStop(0, 'rgba(255,255,255,0.95)');
          bl.addColorStop(0.1, 'rgba(255,246,220,0.85)');
          bl.addColorStop(0.28, 'rgba(255,196,130,0.35)');
          bl.addColorStop(0.6, 'rgba(255,150,100,0.08)');
          bl.addColorStop(1, 'rgba(255,150,100,0)');
          ctx.fillStyle = bl; ctx.fillRect(sx - R * 8, sy - R * 8, R * 16, R * 16);
          ctx.globalCompositeOperation = 'source-over';
          // The disc: white-hot, warm at the edge.
          var dg = ctx.createRadialGradient(sx - R * 0.2, sy - R * 0.25, 0, sx, sy, R);
          dg.addColorStop(0, '#FFFFFF'); dg.addColorStop(0.65, '#FFF8E4'); dg.addColorStop(1, '#FFE2A0');
          ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.283); ctx.fill();

          // Mountains, far to near, each with haze pooling at its foot.
          for (i = 0; i < 4; i++) {
            var pts = ridges[i];
            var top = Math.min.apply(null, pts.map(function (p) { return p[1]; }));
            var lg = ctx.createLinearGradient(0, top, 0, H);
            lg.addColorStop(0, mixc(LAND_N[i], LAND_D[i], k));
            lg.addColorStop(1, mixc(LAND_N[Math.min(3, i + 1)], LAND_D[Math.min(3, i + 1)], k));
            ctx.fillStyle = lg; ridgePath(pts); ctx.fill();
            if (i < 2) {
              // Backlit rim: the ridge nearest the sun catches a thin line of light.
              var rim = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.55);
              rim.addColorStop(0, 'rgba(255,214,170,' + 0.75 * k + ')');
              rim.addColorStop(1, 'rgba(255,214,170,0)');
              ctx.strokeStyle = rim; ctx.lineWidth = 1.2;
              ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
              for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
              ctx.stroke();
            }
            if (i === 3) {
              ctx.fillStyle = mixc(LAND_N[3], LAND_D[3], k);
              var tr = ridges.trees;
              ctx.beginPath();
              for (j = 0; j < tr.length; j++) {
                var q = tr[j];
                ctx.moveTo(q[0] - q[3] / 2, q[1]); ctx.lineTo(q[0], q[1] - q[2]); ctx.lineTo(q[0] + q[3] / 2, q[1]); ctx.closePath();
                ctx.moveTo(q[0] - q[3] * 0.62, q[1] - q[2] * 0.2); ctx.lineTo(q[0], q[1] - q[2] * 0.8); ctx.lineTo(q[0] + q[3] * 0.62, q[1] - q[2] * 0.2); ctx.closePath();
              }
              ctx.fill();
            }
            // Haze between ranges, warmer as the sun comes up.
            var hy = (top + H) / 2;
            var hz = ctx.createLinearGradient(0, hy - H * 0.06, 0, hy + H * 0.06);
            hz.addColorStop(0, mixc('#3A4290', '#FFC8A8', k, 0));
            hz.addColorStop(0.5, mixc('#3A4290', '#FFC8A8', k, 0.16 - i * 0.03));
            hz.addColorStop(1, mixc('#3A4290', '#FFC8A8', k, 0));
            ctx.fillStyle = hz; ctx.fillRect(0, hy - H * 0.06, W, H * 0.12);
          }

          // Drifting valley mist.
          for (i = 0; i < 3; i++) {
            var mx = ((t * (8 + i * 5) + i * W * 0.4) % (W * 1.6)) - W * 0.3, my = horizon + H * (0.1 + i * 0.05);
            var mg = ctx.createRadialGradient(mx, my, 0, mx, my, W * 0.45);
            mg.addColorStop(0, mixc('#8A90D0', '#FFE6D6', k, 0.16));
            mg.addColorStop(1, mixc('#8A90D0', '#FFE6D6', k, 0));
            ctx.save(); ctx.translate(mx, my); ctx.scale(1, 0.18); ctx.translate(-mx, -my);
            ctx.fillStyle = mg; ctx.fillRect(mx - W * 0.5, my - W * 0.5, W, W);
            ctx.restore();
          }
          // A still lake at the foot of the trees, mirroring the sky, the treeline and the sun.
          var L = horizon + H * 0.155;
          var lake = ctx.createLinearGradient(0, L, 0, H);
          lake.addColorStop(0, mixc(SKY_N[3], SKY_D[3], k, 0.92));
          lake.addColorStop(0.35, mixc(SKY_N[2], SKY_D[2], k, 0.9));
          lake.addColorStop(1, mixc('#03040F', '#120E2E', k));
          ctx.fillStyle = lake; ctx.fillRect(0, L, W, H - L);
          // Upside-down treeline, darker and a little blurred by ripples.
          ctx.save();
          ctx.translate(0, 2 * L); ctx.scale(1, -1);
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = mixc(LAND_N[3], LAND_D[3], k);
          var rp = ridges[3];
          ctx.beginPath(); ctx.moveTo(0, L);
          for (j = 0; j < rp.length; j++) ctx.lineTo(rp[j][0], rp[j][1]);
          ctx.lineTo(W, L); ctx.closePath(); ctx.fill();
          var tr2 = ridges.trees;
          ctx.beginPath();
          for (j = 0; j < tr2.length; j++) {
            var q2 = tr2[j];
            ctx.moveTo(q2[0] - q2[3] / 2, q2[1]); ctx.lineTo(q2[0], q2[1] - q2[2]); ctx.lineTo(q2[0] + q2[3] / 2, q2[1]); ctx.closePath();
          }
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
          // A column of sunlight glittering on the water.
          ctx.globalCompositeOperation = 'lighter';
          // Soft glow on the water under the sun, then broken glints on top of it.
          var wg = ctx.createRadialGradient(sx, L, 0, sx, L, H * 0.3);
          wg.addColorStop(0, 'rgba(255,214,170,' + 0.32 * k + ')');
          wg.addColorStop(1, 'rgba(255,214,170,0)');
          ctx.save(); ctx.translate(sx, L); ctx.scale(0.45, 1); ctx.translate(-sx, -L);
          ctx.fillStyle = wg; ctx.fillRect(sx - H * 0.3, L, H * 0.6, H * 0.3);
          ctx.restore();
          var gr = rng(9);
          for (var y = L + 1; y < H; y += 1.6) {
            var d = (y - L) / (H - L);
            var spread = R * (0.5 + d * 3.4);
            var n = 2 + Math.floor(gr() * 3);
            for (var m = 0; m < n; m++) {
              var phase = gr() * 6.283, speed = 1.5 + gr() * 2.5;
              var on = Math.sin(t * speed + phase);
              if (on < 0.2) continue;
              var gx = sx + (gr() - 0.5) * 2 * spread + Math.sin(t * 0.9 + y * 0.3) * 2;
              var gw = (2 + gr() * 7) * (1 - d * 0.5);
              ctx.fillStyle = 'rgba(255,232,196,' + (0.55 * (1 - d) * k * on).toFixed(3) + ')';
              ctx.fillRect(gx - gw / 2, y, gw, 0.9);
            }
          }
          // Faint ripples across the whole surface.
          for (y = L + 6; y < H; y += 7 + ((y * 13) % 5)) {
            var off = Math.sin(t * 0.8 + y) * 30;
            ctx.fillStyle = 'rgba(255,255,255,' + (0.035 * k + 0.015) + ')';
            ctx.fillRect(((y * 37) % W) + off, y, 30 + ((y * 7) % 60), 1);
          }
          ctx.globalCompositeOperation = 'source-over';
          // Mist hugging the shoreline, then darkness toward the bottom edge.
          var shore = ctx.createLinearGradient(0, L - H * 0.025, 0, L + H * 0.03);
          shore.addColorStop(0, mixc('#8A90D0', '#FFE0CC', k, 0));
          shore.addColorStop(0.5, mixc('#8A90D0', '#FFE0CC', k, 0.22));
          shore.addColorStop(1, mixc('#8A90D0', '#FFE0CC', k, 0));
          ctx.fillStyle = shore; ctx.fillRect(0, L - H * 0.025, W, H * 0.055);
          var vg = ctx.createLinearGradient(0, H * 0.82, 0, H);
          vg.addColorStop(0, 'rgba(6,5,20,0)');
          vg.addColorStop(1, 'rgba(6,5,20,0.75)');
          ctx.fillStyle = vg; ctx.fillRect(0, H * 0.82, W, H * 0.18);

          if (!still && host.isConnected) requestAnimationFrame(frame);
        }

        build();
        window.addEventListener('resize', function () { build(); if (still) frame(performance.now()); });
        if (still) frame(performance.now()); else requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
