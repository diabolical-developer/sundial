<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Sundial</title>
    <meta name="description" content="A to-do list laid out along the sun's path." />

    <!-- Install on iPhone: Safari → Share → Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sundial" />
    <!-- Let the sky run under the status bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#17143A" />

    <style id="expo-reset">
      html, body { height: 100%; background: #17143A; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea, input:focus-visible, textarea:focus-visible { outline: none; }
      *:focus-visible { outline: 2px solid #FFC21A; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <noscript>Sundial needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
